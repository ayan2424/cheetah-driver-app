name: iOS Simulator Build for LambdaTest

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS Simulator App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ./cheetah_driver_app
        run: flutter pub get

      - name: Build iOS for Simulator
        working-directory: ./cheetah_driver_app
        # This builds a .app which doesn't require a paid Apple Developer Account
        run: flutter build ios --simulator

      - name: Zip the .app for LambdaTest
        working-directory: ./cheetah_driver_app/build/ios/iphonesimulator
        run: zip -r Runner.app.zip Runner.app

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: cheetah_driver_app/build/ios/iphonesimulator/Runner.app.zip
          retention-days: 5
